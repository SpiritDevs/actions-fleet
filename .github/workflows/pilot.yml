name: Fleet pilot
on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Enrolled fleet capability label
        type: string
        default: fleet-macos-arm64
        required: true
      hold_seconds:
        description: Keep a step running to test live output and cancellation
        type: choice
        default: "0"
        options: ["0", "60", "180"]
permissions:
  contents: read
jobs:
  console:
    name: Native console and masking
    runs-on: [self-hosted, "${{ inputs.runner_label }}"]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Quiet output and masking
        shell: bash
        run: |
          test_secret="fleet-pilot-synthetic-$(printf '%s' secret)-314159"
          echo "::add-mask::$test_secret"
          echo 'Fleet pilot started'
          echo "masked value: $test_secret"
          sleep 2
          echo 'quiet step resumed'
          printf 'unicode: café 🛠️\n'
      - name: Control window
        if: inputs.hold_seconds != '0' && inputs.hold_seconds != ''
        env:
          FLEET_PILOT_HOLD: ${{ inputs.hold_seconds }}
        run: |
          node -e '
            const limit = Number(process.env.FLEET_PILOT_HOLD);
            if (![60, 180].includes(limit)) process.exit(1);
            console.log("fleet-control-window-started");
            let elapsed = 0;
            const timer = setInterval(() => {
              console.log(`fleet-control-tick ${++elapsed}`);
              if (elapsed >= limit) clearInterval(timer);
            }, 1000);
          '
      - name: Composite action
        uses: ./.github/actions/pilot-composite
      - name: JavaScript action
        uses: actions/github-script@v8
        with:
          script: |
            core.info('JavaScript action console output');
            core.startGroup('grouped output');
            core.info('group line');
            core.endGroup();
      - name: Volume and artifact
        shell: bash
        run: |
          node -e 'for(let i=0;i<2000;i++) console.log(`pilot line ${i}`)'
          mkdir -p pilot-output
          printf 'Native fleet pilot completed\n' > pilot-output/result.txt
      - uses: actions/upload-artifact@v7
        with:
          name: fleet-pilot-result
          path: pilot-output/result.txt
          retention-days: 1
      - name: Final console marker
        if: always()
        run: echo 'fleet-pilot-final-tail'
